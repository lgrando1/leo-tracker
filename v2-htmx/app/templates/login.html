<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100 antialiased">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🦁 Leo Tracker Pro · Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full flex items-center justify-center px-4 py-12 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
    <main class="w-full max-w-md">
        <article class="rounded-2xl bg-slate-900/90 border border-slate-800 p-8 shadow-2xl backdrop-blur">
            <div class="text-center mb-6">
                <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-3xl mb-3">
                    🦁
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Leo Tracker Pro</h1>
                <p class="text-xs text-slate-400 mt-1">Acesso protegido · Digite sua senha para continuar</p>
            </div>

            {% if error %}
            <div role="alert" class="mb-4 rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 text-xs font-semibold text-rose-300 text-center">
                🔒 {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="post" class="space-y-4">
                <div>
                    <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">
                        Senha de Acesso:
                    </label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        required
                        autofocus
                        autocomplete="current-password"
                        placeholder="••••••••"
                        class="w-full rounded-xl bg-slate-950 border border-slate-700 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"
                    />
                </div>

                <button
                    type="submit"
                    class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold text-sm py-2.5 px-4 transition shadow-md"
                >
                    Entrar
                </button>
            </form>
        </article>
    </main>
</body>
</html>
